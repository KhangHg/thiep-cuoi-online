<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thiệp mời cưới</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
         background: radial-gradient(#d9a5a055 1.5px, transparent 2px) 0 0/22px 22px, #f6e9e6;
         font-family: 'Lora', serif; color: #4a3b3b; text-align: center; }
  .box { background: #fffaf7; border-radius: 18px; padding: 44px 32px; max-width: 420px; box-shadow: 0 24px 60px rgba(0,0,0,.12); }
  img { width: 100%; border-radius: 12px; margin-bottom: 18px; -webkit-mask-image: linear-gradient(#000 75%, transparent); mask-image: linear-gradient(#000 75%, transparent); }
  h1 { font-family: 'Great Vibes', cursive; font-weight: 400; color: #b4636e; font-size: 46px; margin: 0 0 8px; }
  p { line-height: 1.6; margin: 0; }
</style>
</head>
<body>
  <div class="box">
    <img src="images/nen-cuoi-2.webp" alt="">
    <h1>Thiệp mời cưới</h1>
    <p>Vui lòng mở đường link thiệp mời riêng mà cô dâu chú rể đã gửi cho bạn nhé 💌</p>
  </div>
</body>
</html>
